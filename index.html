<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sugar Atlas | Global Transit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">THE SUGAR ATLAS</div>
        <div class="passport-stats">STAMPS: <span id="stamp-count">0</span>/30</div>
    </nav>

    <main id="terminal">
        <section class="hero">
            <h1 class="font-mileast">CHOOSE YOUR DESTINATION</h1>
            <p>Select a country to begin your culinary transit.</p>
        </section>

        <div class="destination-grid" id="dest-grid">
            </div>
    </main>

    <div id="transit-overlay" class="hidden">
        <div class="plane">✈️</div>
        <h2 class="font-mileast">DEPARTING FOR <span id="target-country">...</span></h2>
    </div>

    <section id="recipe-page" class="hidden">
        <div class="recipe-container">
            <button onclick="returnToTerminal()" class="back-btn">← RETURN TO TERMINAL</button>
            <div id="recipe-content">
                </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
