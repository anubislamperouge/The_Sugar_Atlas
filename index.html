<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Passport | The Midnight Tour</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="brand">THE SWEET PASSPORT</div>
        <div class="stats">Stamps: <span id="stamp-count">0</span>/30</div>
    </nav>

    <main id="airport-screen">
        <section class="hero">
            <h1>CHOOSE YOUR DESTINATION</h1>
            <p>Select a country to begin your culinary transit.</p>
        </section>

        <div class="destination-grid" id="dest-grid">
            </div>
    </main>

    <div id="transit-overlay" class="hidden">
        <div class="plane-icon">✈️</div>
        <h2>Departing for <span id="target-country">...</span></h2>
    </div>

    <section id="recipe-page" class="hidden">
        <button onclick="returnToAirport()" class="back-btn">← Return to Terminal</button>
        <div id="recipe-content"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
