<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sugar Atlas | Global Transit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js"></div>

    <nav>
        <div class="nav-left">
            <div class="logo font-mileast">THE SUGAR ATLAS</div>
            <div class="rank-tag">RANK: <span id="explorer-rank">NOVICE TRAVELER</span></div>
        </div>
        <div class="nav-right">
            <div class="passport-stats">
                <span class="stat-label">STAMPS</span>
                <span id="stamp-count">0</span><span class="total">/30</span>
                <div class="progress-bar-mini"><div id="progress-fill"></div></div>
            </div>
        </div>
    </nav>

    <main id="terminal">
        <section class="hero">
            <h1 class="font-mileast">CHOOSE YOUR DESTINATION</h1>
            <p class="subtitle">A curated global transit of taste. Explore the world's finest confections.</p>
            <button id="roulette-btn" class="gold-btn">✈️ SUGAR ROULETTE</button>
        </section>

        <div class="destination-grid" id="dest-grid">
            </div>
    </main>

    <div id="transit-overlay" class="hidden">
        <div class="flight-path">
            <div class="plane">✈️</div>
        </div>
        <h2 class="font-mileast">DEPARTING FOR <span id="target-country">...</span></h2>
    </div>

    <section id="recipe-page" class="hidden">
        <div class="recipe-wrapper">
            <button onclick="returnToTerminal()" class="close-btn">CLOSE DOSSIER</button>
            <div id="recipe-content"></div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
